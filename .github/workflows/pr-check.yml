name: PR — Build Check

# ─────────────────────────────────────────────────────────────────
# Runs on every Pull Request to main/master to verify that the
# code compiles and builds successfully BEFORE it is merged.
# ─────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches:
      - main
      - master

env:
  NODE_VERSION: '20.x'

jobs:
  build-check:
    name: Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Lint check — ensures code style is clean
      # Uncomment if you add ESLint to the project:
      # - name: Lint
      #   run: npm run lint

      # Build to catch any TypeScript compile errors
      - name: Build (Production Check)
        run: npm run build -- --configuration prod

      - name: PR Build Passed
        run: echo "PR build check passed — safe to merge."
