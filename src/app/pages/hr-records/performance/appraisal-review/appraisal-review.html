@let s = store.stats();

<!-- =========================================================
     HEADER
========================================================== -->
<div class="d-flex align-items-start justify-content-between flex-wrap gap-3 mb-3">
  <div>
    <h1 class="page-title">Performance Appraisal</h1>
    <p class="text-muted small mb-0">Self-Review → Team Lead → HR → Manager → Scorecard</p>
  </div>
  <button type="button" class="btn btn-primary" (click)="cycleModal.open('add')">
    <i class="bi bi-rocket-takeoff"></i>
    <span>Launch New Cycle</span>
  </button>
</div>

<!-- =========================================================
     FEEDBACK
========================================================== -->
@if (store.feedback(); as f) {
<div class="alert d-flex align-items-center justify-content-between gap-2 py-2 px-3 mb-3"
  [class.alert-success]="f.type === 'success'" [class.alert-warning]="f.type === 'warning'" role="status">
  <span class="small fw-semibold">
    <i class="bi" [class.bi-check-circle-fill]="f.type === 'success'"
      [class.bi-exclamation-triangle-fill]="f.type === 'warning'"></i>
    {{ f.text }}
  </span>
  <button type="button" class="btn-close" aria-label="Close" (click)="store.feedback.set(null)"></button>
</div>
}

<!-- =========================================================
     KPI — the three queues open the matching reviewer desk
========================================================== -->
<div class="stat-grid">
  <app-stat-card label="In This Cycle" [value]="s.total" icon="bi bi-people" tone="primary"
    [sub]="s.drafts + ' self-review draft' + (s.drafts === 1 ? '' : 's')" (click)="openDesk('all')"
    [clickable]="true" [active]="store.portal() === 'reviewer' && store.deskTab() === 'all'" />
  <app-stat-card label="Awaiting Team Lead" [value]="s.tl" icon="bi bi-people" tone="blue"
    [clickable]="true" [active]="store.portal() === 'reviewer' && store.deskTab() === 'tl'" (click)="openDesk('tl')" />
  <app-stat-card label="Awaiting HR" [value]="s.hr" icon="bi bi-shield-check" tone="violet"
    [clickable]="true" [active]="store.portal() === 'reviewer' && store.deskTab() === 'hr'" (click)="openDesk('hr')" />
  <app-stat-card label="Awaiting Manager" [value]="s.mgr" icon="bi bi-award" tone="amber"
    [clickable]="true" [active]="store.portal() === 'reviewer' && store.deskTab() === 'mgr'" (click)="openDesk('mgr')" />
  <app-stat-card label="Completed" [value]="s.done" icon="bi bi-patch-check" tone="teal" sub="Scorecard released" />
</div>

<!-- =========================================================
     PORTAL SWITCH
========================================================== -->
<nav class="page-tabs mb-3" role="tablist" aria-label="Portal">
  <button type="button" role="tab" class="page-tab" [class.active]="store.portal() === 'employee'"
    [attr.aria-selected]="store.portal() === 'employee'" (click)="store.portal.set('employee')">
    <i class="bi bi-person"></i> Employee Portal
  </button>
  <button type="button" role="tab" class="page-tab" [class.active]="store.portal() === 'reviewer'"
    [attr.aria-selected]="store.portal() === 'reviewer'" (click)="store.portal.set('reviewer')">
    <i class="bi bi-shield-lock"></i> Reviewer Desk
    @if (store.pendingActions()) {
    <span class="page-tab-count has-unread">{{ store.pendingActions() }}</span>
    }
  </button>
</nav>

@if (store.portal() === 'employee') {
<app-appraisal-employee-portal />
} @else {
<app-appraisal-reviewer-desk />
}

<!-- =========================================================
     MODALS
========================================================== -->
@if (store.scorecardKey()) {
<app-appraisal-scorecard-modal />
}

<app-reuse-modal #cycleModal [fields]="cycleFields" title="Launch New Appraisal Cycle" saveLabel="Launch Cycle"
  submitIcon="bi bi-rocket-takeoff" (saved)="onCycleLaunched($event)"></app-reuse-modal>
