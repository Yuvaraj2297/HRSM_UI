@let s = store.stats();

<!-- =========================================================
     HEADER
========================================================== -->
<div class="d-flex align-items-start justify-content-between flex-wrap gap-3 mb-3">
  <div>
    <h1 class="page-title">360° Feedback</h1>
    <p class="text-muted small mb-0">Manager → Team Lead → HR sign-off → Published report</p>
  </div>
  <button type="button" class="btn btn-primary" (click)="cycleModal.open('add')">
    <i class="bi bi-arrow-repeat"></i>
    <span>New 360° Cycle</span>
  </button>
</div>

<!-- =========================================================
     FEEDBACK
========================================================== -->
@if (store.feedback(); as f) {
<div class="alert d-flex align-items-center justify-content-between gap-2 py-2 px-3 mb-3"
  [class.alert-success]="f.type === 'success'" [class.alert-warning]="f.type === 'warning'" role="status">
  <span class="small fw-semibold">
    <i class="bi" [class.bi-check-circle-fill]="f.type === 'success'"
      [class.bi-exclamation-triangle-fill]="f.type === 'warning'"></i>
    {{ f.text }}
  </span>
  <button type="button" class="btn-close" aria-label="Close" (click)="store.feedback.set(null)"></button>
</div>
}

<!-- =========================================================
     KPI
========================================================== -->
<div class="stat-grid">
  <app-stat-card label="Reviews" [value]="s.total" icon="bi bi-people" tone="primary"
    [sub]="'Across ' + s.cycles + ' cycle' + (s.cycles === 1 ? '' : 's')" />
  <app-stat-card label="Awaiting Feedback" [value]="s.pending" icon="bi bi-hourglass-split" tone="amber"
    [sub]="s.overdue ? s.overdue + ' overdue' : s.dueSoon + ' due this week'" [subTone]="s.overdue ? 'danger' : ''"
    [clickable]="true" [active]="store.tab() === 'evaluate'" (click)="store.tab.set('evaluate')" />
  <app-stat-card label="Published Reports" [value]="s.published" icon="bi bi-file-earmark-check" tone="teal"
    [clickable]="true" [active]="store.tab() === 'report'" (click)="store.tab.set('report')" />
  <app-stat-card label="Avg 360° Score" [value]="s.avg === null ? '—' : s.avg + ' / 5'" icon="bi bi-star" tone="blue"
    sub="Published reports" />
</div>

<!-- =========================================================
     TABS
========================================================== -->
<nav class="page-tabs mb-3" role="tablist">
  <button type="button" role="tab" class="page-tab" [class.active]="store.tab() === 'overview'"
    [attr.aria-selected]="store.tab() === 'overview'" (click)="store.tab.set('overview')">
    <i class="bi bi-list-ul"></i> Overview
    <span class="page-tab-count">{{ s.total }}</span>
  </button>
  <button type="button" role="tab" class="page-tab" [class.active]="store.tab() === 'evaluate'"
    [attr.aria-selected]="store.tab() === 'evaluate'" (click)="store.tab.set('evaluate')">
    <i class="bi bi-pencil-square"></i> Give Feedback
    @if (s.pending) { <span class="page-tab-count has-unread">{{ s.pending }}</span> }
  </button>
  <button type="button" role="tab" class="page-tab" [class.active]="store.tab() === 'report'"
    [attr.aria-selected]="store.tab() === 'report'" (click)="store.tab.set('report')">
    <i class="bi bi-file-earmark-bar-graph"></i> 360° Reports
    <span class="page-tab-count">{{ s.published }}</span>
  </button>
</nav>

@switch (store.tab()) {
  @case ('overview') { <app-feedback-overview-panel /> }
  @case ('evaluate') { <app-feedback-evaluate-panel /> }
  @case ('report') { <app-feedback-report-panel /> }
}

<app-reuse-modal #cycleModal [fields]="cycleFields" title="Launch 360° Feedback Cycle" saveLabel="Launch Cycle"
  submitIcon="bi bi-arrow-repeat" (saved)="onCycleLaunched($event)"></app-reuse-modal>
