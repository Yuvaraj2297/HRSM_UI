<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
  <div class="form-section-title m-0 border-0 p-0"><span class="form-section-icon"><i class="bi bi-person-vcard"></i></span>KYC Document</div>

  <div class="d-flex align-items-center gap-2">
    <span class="field-hint m-0">{{ uploadedMandatory }} / {{ totalMandatory }} uploaded</span>
    <div class="ui-meter kyc-meter m-0"><span [style.width.%]="progress"></span></div>
  </div>
</div>

<div class="data-table-wrap" [formGroup]="form">
  <table class="data-table data-table-left" formArrayName="kyc">
    <thead>
      <tr>
        <th class="col-doc">Document Name</th>
        <th>Upload Field</th>
        <th class="text-center">Mandatory</th>
        <th>File View</th>
        <th class="text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of kyc.controls; let i = index" [formGroupName]="i">
        <td>
          <ng-container *ngIf="!row.value.custom; else customName">
            <div class="cell-strong">{{ row.value.name }}</div>
            <div class="ui-cell-sub">{{ row.value.desc }}</div>
          </ng-container>
          <ng-template #customName>
            <input pInputText class="form-control" formControlName="name" placeholder="Enter document name" />
          </ng-template>
        </td>

        <td>
          <div class="d-flex align-items-center gap-2">
            <label class="btn btn-secondary btn-sm m-0">
              <i class="bi bi-cloud-arrow-up"></i> Choose File
              <input type="file" accept=".pdf,.jpg,.jpeg,.png" hidden (change)="onFile($event, i)" />
            </label>
            <span class="ui-cell-sub text-truncate">{{ row.value.fileName || 'No file chosen' }}</span>
          </div>
        </td>

        <td class="text-center">
          <span class="ui-tag" [class.tone-danger]="row.value.mandatory">{{ row.value.mandatory ? 'Yes' : 'No' }}</span>
        </td>

        <td>
          <span class="ui-cell-sub" [class.cell-strong]="!!row.value.fileName">{{ row.value.fileName || 'No file' }}</span>
        </td>

        <td class="text-center">
          <button type="button" class="btn-icon btn-sm btn-icon-danger" *ngIf="row.value.fileName || row.value.custom"
            (click)="removeOrClear(i)" aria-label="Remove">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="mt-3">
  <button type="button" class="btn btn-outline-primary" (click)="addCustom()">
    <i class="bi bi-plus-lg"></i> Custom Document
  </button>
</div>
