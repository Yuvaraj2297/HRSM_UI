<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
  <div class="form-section-title m-0 border-0 p-0"><span class="form-section-icon"><i class="bi bi-shield-lock"></i></span>Permissions</div>
  <div class="d-flex align-items-center gap-2">
    <button type="button" class="ui-link-btn" (click)="selectAll()">Select All</button>
    <span class="field-hint m-0">|</span>
    <button type="button" class="ui-link-btn" (click)="deselectAll()">Deselect All</button>
  </div>
</div>

<div class="row g-3 mb-3" [formGroup]="permissions">
  <div class="col-lg-4 col-md-6">
    <label class="form-label required-label">Role</label>
    <app-select formControlName="role" (ngModelChange)="applyRole($event)" [options]="fs.roles" optionLabel="label" optionValue="value" placeholder="—" />
  </div>

  <div class="col-lg-8 col-md-6 d-flex align-items-end">
    @if (roleDescription) {
    <div class="ui-hint mb-1"><i class="bi bi-info-circle"></i> {{ roleDescription }}</div>
    }
  </div>
</div>

<div class="data-table-wrap">
  <table class="data-table data-table-left">
    <thead>
      <tr>
        <th class="col-module">Module</th>
        <th>Capabilities</th>
        <th class="text-center">All</th>
      </tr>
    </thead>
    <tbody>
      @for (group of groups; track group.key) {
      <tr class="row-group">
        <td colspan="3"><i [class]="group.icon"></i>{{ group.label }}</td>
      </tr>
      @for (mod of group.modules; track mod.feature) {
      <tr>
        <td class="cell-strong">{{ mod.feature }}</td>
        <td>
          <div class="d-flex flex-wrap gap-2 column-gap-4">
            @for (cap of mod.caps; track cap.value) {
            <label class="ui-check">
              <input type="checkbox" [checked]="has(cap.value)" (change)="toggle(cap.value)" />
              {{ cap.label }}
            </label>
            }
          </div>
        </td>
        <td class="text-center">
          <button type="button" class="ui-link-btn" (click)="toggleModule(mod)">{{ allChecked(mod) ? 'Deselect All' : 'Select All' }}</button>
        </td>
      </tr>
      }
      }
    </tbody>
  </table>
</div>
