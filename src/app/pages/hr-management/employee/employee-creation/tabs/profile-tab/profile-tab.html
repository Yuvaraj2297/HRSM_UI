<!-- ===== Personal Details ===== -->
<div class="form-section-title"><span class="form-section-icon"><i class="bi bi-person"></i></span>Personal Details</div>

<div class="row g-3" [formGroup]="profile">
  <div class="col-lg-2 col-md-3">
    <label class="form-label">Profile Image</label>
    <label class="ui-image-drop" [class.has-image]="photoPreview()">
      <img *ngIf="photoPreview() as src" [src]="src" alt="Profile preview">
      <i class="bi bi-camera"></i>
      <div class="ui-file-drop-text">Choose File</div>
      <div class="ui-file-drop-hint">JPG, PNG (Max 2MB)</div>
      <input type="file" accept="image/png, image/jpeg" hidden (change)="onPhoto($event)">
    </label>
  </div>

  <div class="col-lg-10">
    <div class="row g-3">
      
      <div class="col-lg-4 col-md-6">
        <label class="form-label">First Name</label>
        <input (input)="preventNumbers($event)" pInputText class="form-control" formControlName="firstName" placeholder="Enter first name">
      </div>
      <div class="col-lg-4 col-md-6">
        <label class="form-label required-label"> Last Name</label>
        <input (input)="preventNumbers($event)" pInputText class="form-control" formControlName="lastName" placeholder="Enter last name">
      </div>

      <div class="col-lg-4 col-md-6">
        <label class="form-label">Gender</label>
        <app-select formControlName="gender" [options]="fs.genders" optionLabel="label" optionValue="value" placeholder="Non selected" />
      </div>
      <div class="col-lg-4 col-md-6">
        <label class="form-label">Birthday</label>
  <input type="text" class="form-control" placeholder="DD/MM/YYYY" formControlName="birthday"
            appCalendarDatepicker>
      </div>
      <div class="col-lg-4 col-md-6">
        <label class="form-label">Age</label>
        <input pInputText class="form-control" formControlName="age" placeholder="Auto from birthday">
      </div>

      <div class="col-lg-4 col-md-6">
        <label class="form-label">Birthplace</label>
        <input pInputText class="form-control" formControlName="birthplace" placeholder="Enter birthplace">
      </div>
      <div class="col-lg-4 col-md-6">
        <label class="form-label">Present address</label>
        <input pInputText class="form-control" formControlName="presentAddress" placeholder="Enter present address">
      </div>
      <div class="col-lg-4 col-md-6">
        <label class="form-label">Home town</label>
        <input pInputText class="form-control" formControlName="homeTown" placeholder="Enter home town">
      </div>

      <div class="col-lg-4 col-md-6">
        <label class="form-label">Nation</label>
        <input pInputText class="form-control" formControlName="nation" placeholder="Enter nation">
      </div>
      <div class="col-lg-4 col-md-6">
        <label class="form-label">Religion</label>
        <input pInputText class="form-control" formControlName="religion" placeholder="Enter religion">
      </div>
      <div class="col-lg-4 col-md-6">
        <label class="form-label">ID Document Type</label>
        <input pInputText class="form-control" formControlName="idDocType" placeholder="e.g. Aadhaar / PAN / Passport">
      </div>

      <div class="col-lg-4 col-md-6">
        <label class="form-label">Permanent Address</label>
        <input pInputText class="form-control" formControlName="permanentAddress" placeholder="Enter permanent address">
      </div>
      <div class="col-lg-4 col-md-6">
        <label class="form-label">Blood Group</label>
        <app-select formControlName="bloodGroup" [options]="fs.bloodGroups" optionLabel="label" optionValue="value" placeholder="Non selected" />
      </div>
      <div class="col-lg-4 col-md-6">
        <label class="form-label">Latitude</label>
        <input pInputText class="form-control" formControlName="latitude" placeholder="Enter latitude">
      </div>

      <div class="col-lg-4 col-md-6">
        <label class="form-label">Longitude</label>
        <input pInputText class="form-control" formControlName="longitude" placeholder="Enter longitude">
      </div>
      <div class="col-lg-8">
        <label class="form-label">Other information</label>
        <textarea pTextarea class="form-control" rows="3" formControlName="otherInfo" placeholder="Enter other information"></textarea>
      </div>
    </div>
  </div>
</div>

<!-- ===== Emergency Contact ===== -->
<div class="form-section-title"><span class="form-section-icon"><i class="bi bi-telephone"></i></span>Emergency Contact Details</div>
<div class="row g-3" [formGroup]="emergency">
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Emergency Contact Name</label>
    <input (input)="preventNumbers($event)" pInputText class="form-control" formControlName="name" placeholder="Enter name">
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Emergency Contact Number</label>
    <input (input)="preventAlphabets($event)" pInputText class="form-control" formControlName="phone" placeholder="98765 43210">
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Emergency Contact Blood Group</label>
    <app-select formControlName="bloodGroup" [options]="fs.bloodGroups" optionLabel="label" optionValue="value" placeholder="Non selected" />
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Type of Relationship</label>
    <input pInputText class="form-control" formControlName="relation" placeholder="e.g. Father, Spouse, Friend">
  </div>
</div>

<!-- ===== Job Details ===== -->
<div class="form-section-title"><span class="form-section-icon"><i class="bi bi-briefcase"></i></span>Job Details</div>
<div class="row g-3" [formGroup]="job">
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Date of Joining</label>
    <input type="text" class="form-control" placeholder="DD/MM/YYYY" appCalendarDatepicker>
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Experience</label>
    <input pInputText class="form-control" formControlName="experience" placeholder="e.g. 3 Years 2 Months">
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Job Type</label>
    <app-select formControlName="jobType" [options]="fs.jobTypes" optionLabel="label" optionValue="value" placeholder="Nothing selected" />
  </div>

  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Designation</label>
    <app-select formControlName="designation" [options]="fs.designations" optionLabel="label" optionValue="value" placeholder="Non selected" />
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label required-label"> Phone</label>
    <input pInputText class="form-control" formControlName="phone" placeholder="98765 43210">
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label required-label"> Official Email</label>
    <input pInputText class="form-control" formControlName="officialEmail" placeholder="name@company.com">
  </div>

  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label required-label"> Personal Email</label>
    <input pInputText class="form-control" formControlName="personalEmail" placeholder="name@gmail.com">
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Branch</label>
    <app-select formControlName="branch" [options]="fs.branches" optionLabel="label" optionValue="value" placeholder="Non selected" />
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Reporting To</label>
    <app-select formControlName="reportingTo" [options]="fs.managers" optionLabel="label" optionValue="value" placeholder="Non selected" />
  </div>

  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Status</label>
    <app-select formControlName="status" [options]="fs.statuses" optionLabel="label" optionValue="value" placeholder="Non selected" />
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Employee Type</label>
    <app-select formControlName="employeeType" [options]="fs.employeeTypes" optionLabel="label" optionValue="value" placeholder="Non selected" />
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Worklocation</label>
    <app-select formControlName="workLocation" [options]="fs.workLocations" optionLabel="label" optionValue="value" placeholder="Non selected" />
  </div>

  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Offer Letter Date</label>
    <input type="text" class="form-control" placeholder="DD/MM/YYYY" appCalendarDatepicker>
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Notice Period (In Days)</label>
    <input pInputText type="number" class="form-control" formControlName="noticePeriodDays" placeholder="e.g. 30">
  </div>
  <div class="col-lg-3 col-md-4 col-12 d-flex align-items-end pb-2">
    <label class="ui-check">
      <p-checkbox formControlName="mobileAppIssues" [binary]="true" inputId="mobileAppIssues" />
      <span>Mobile App Issues</span>
    </label>
  </div>

  <div class="col-12">
    <label class="form-label">Onboarding Commitment</label>
    <textarea pTextarea class="form-control" rows="3" formControlName="onboardingCommitment" placeholder="Enter onboarding commitment"></textarea>
  </div>
</div>

<!-- ===== Salary Details ===== -->
<div class="form-section-title"><span class="form-section-icon"><i class="bi bi-cash-stack"></i></span>Salary Details</div>
<div class="row g-3" [formGroup]="salary">
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Salary Type</label>
    <app-select formControlName="salaryType" [options]="fs.salaryTypes" optionLabel="label" optionValue="value" placeholder="Non selected" />
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">CTC (Annual)</label>
    <div class="input-group">
      <span class="input-group-text">₹</span>
      <input pInputText type="number" class="form-control" formControlName="ctc" placeholder="e.g. 600000">
    </div>
    <small class="text-muted">Cost To Company per annum</small>
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Personal tax code</label>
    <input pInputText class="form-control" formControlName="taxCode" placeholder="e.g. TX001">
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Hourly Rate</label>
    <input pInputText type="number" class="form-control" formControlName="hourlyRate" placeholder="0">
  </div>

  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">PF Eligible</label>
    <app-select formControlName="pfEligible" [options]="fs.yesNo" optionLabel="label" optionValue="value" placeholder="Nothing selected" />
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">ESI Eligible</label>
    <app-select formControlName="esiEligible" [options]="fs.yesNo" optionLabel="label" optionValue="value" placeholder="Nothing selected" />
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">OT Eligible</label>
    <app-select formControlName="otEligible" [options]="fs.yesNo" optionLabel="label" optionValue="value" placeholder="Nothing selected" />
  </div>

  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">UAN No</label>
    <input pInputText class="form-control" formControlName="uan" placeholder="Enter UAN number">
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">ESI No</label>
    <input pInputText class="form-control" formControlName="esiNo" placeholder="Enter ESI number">
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Aadhaar No</label>
    <input pInputText class="form-control" formControlName="aadhaarNo" placeholder="Enter Aadhaar number">
  </div>

  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">PAN No</label>
    <input pInputText class="form-control" formControlName="panNo" placeholder="Enter PAN number">
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">PENSION Eligible</label>
    <app-select formControlName="pensionEligible" [options]="fs.yesNo" optionLabel="label" optionValue="value" placeholder="Nothing selected" />
  </div>
  <div class="col-lg-3 col-md-4 col-12">
    <label class="form-label">Salary Calendar</label>
    <app-select formControlName="salaryCalendar" [options]="fs.salaryCalendars" optionLabel="label" optionValue="value" placeholder="Nothing selected" />
  </div>
</div>

<!-- ===== Interview Feedback ===== -->
<div class="form-section-title"><span class="form-section-icon"><i class="bi bi-chat-square-text"></i></span>Interview Feedback Consolidated</div>
<div class="row g-3" [formGroup]="interview">
  <div class="col-lg-3 col-md-6">
    <label class="form-label">Round 1 - CV Screening</label>
    <textarea pTextarea class="form-control" rows="3" formControlName="round1" placeholder="Enter feedback"></textarea>
  </div>
  <div class="col-lg-3 col-md-6">
    <label class="form-label">Round 2 - Technical Round</label>
    <textarea pTextarea class="form-control" rows="3" formControlName="round2" placeholder="Enter feedback"></textarea>
  </div>
  <div class="col-lg-3 col-md-6">
    <label class="form-label">Round 3 - HR</label>
    <textarea pTextarea class="form-control" rows="3" formControlName="round3" placeholder="Enter feedback"></textarea>
  </div>
  <div class="col-lg-3 col-md-6">
    <label class="form-label">Round 4 - Salary Negotiation</label>
    <textarea pTextarea class="form-control" rows="3" formControlName="round4" placeholder="Enter feedback"></textarea>
  </div>
</div>

<!-- ===== Welcome Kit ===== -->
<div class="form-section-title"><span class="form-section-icon"><i class="bi bi-gift"></i></span>Welcome Kit</div>

<div [formGroup]="form">
  <div formArrayName="welcomeKit">
    <div class="row g-3 align-items-end mb-3" *ngFor="let row of welcomeKit.controls; let i = index" [formGroupName]="i">
      <div class="col-md-6">
        <label class="form-label">ID Card</label>
        <app-select formControlName="idCard" [options]="fs.idCardStatuses" optionLabel="label" optionValue="value" placeholder="Nothing selected" />
      </div>
      <div class="col-md-6">
        <label class="form-label">ID Card Issued Date</label>
       <input type="text" class="form-control" placeholder="DD/MM/YYYY" appCalendarDatepicker>
      </div>
      
    </div>
  </div>

  <div class="mt-2">
    <label class="form-label">Others</label>
    <textarea pTextarea class="form-control" rows="3" formControlName="welcomeKitOthers" placeholder="Enter other welcome kit items"></textarea>
  </div>
</div>

<!-- ===== Social Media ===== -->
<div class="form-section-title"><span class="form-section-icon"><i class="bi bi-share"></i></span>Social Media</div>
<div class="row g-3" [formGroup]="social">
  <div class="col-lg-4 col-md-6">
    <label class="form-label"><i class="bi bi-facebook me-1"></i> Facebook</label>
    <input pInputText class="form-control" formControlName="facebook" placeholder="Facebook profile URL">
  </div>
  <div class="col-lg-4 col-md-6">
    <label class="form-label"><i class="bi bi-linkedin me-1"></i> Linkedin</label>
    <input pInputText class="form-control" formControlName="linkedin" placeholder="Linkedin profile URL">
  </div>
  <div class="col-lg-4 col-md-6">
    <label class="form-label"><i class="bi bi-skype me-1"></i> Skype</label>
    <input pInputText class="form-control" formControlName="skype" placeholder="Skype ID">
  </div>
</div>

<!-- ===== Member departments ===== -->
<div [formGroup]="form">
  <label class="form-label mt-3">Member departments</label>
  <div class="ui-check-grid">
    <label class="ui-check" *ngFor="let d of fs.departmentList">
      <p-checkbox [value]="d" formControlName="departments" [inputId]="'dept-' + d" />
      <span>{{ d }}</span>
    </label>
  </div>

  <div class="d-flex flex-column gap-2 mt-3">
    <label class="ui-check">
      <p-checkbox formControlName="administrator" [binary]="true" inputId="administrator" />
      <span>Administrator</span>
    </label>
    <label class="ui-check">
      <p-checkbox formControlName="sendWelcomeEmail" [binary]="true" inputId="sendWelcomeEmail" />
      <span>Send welcome email</span>
    </label>
  </div>
</div>
