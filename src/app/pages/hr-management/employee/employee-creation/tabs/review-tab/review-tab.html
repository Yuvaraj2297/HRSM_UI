<div class="form-section-title"><span class="form-section-icon"><i class="bi bi-check2-square"></i></span>Review &amp; Confirm</div>

<div class="ui-sec mb-3" *ngFor="let s of sections">
  <div class="ui-sec-title"><i [class]="s.icon"></i> {{ s.title }}</div>
  <div class="ui-meta-grid ui-meta-grid--auto">
    <div *ngFor="let it of s.items">
      <div class="ui-meta-label">{{ it.k }}</div>
      <div class="ui-meta-value">{{ display(it.v) }}</div>
    </div>
  </div>
</div>

<label class="ui-check mt-2" [formGroup]="fs.form">
  <p-checkbox formControlName="confirmAccuracy" [binary]="true" inputId="confirmAccuracy" />
  <span>I confirm the above details are accurate to the best of my knowledge.</span>
</label>
