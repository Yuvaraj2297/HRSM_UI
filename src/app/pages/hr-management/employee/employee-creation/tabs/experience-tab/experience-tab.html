<div class="ne-section-title">Experience Details :-</div>

<div [formGroup]="form">
  <div formArrayName="experience">
    <div class="ne-experience-item" *ngFor="let row of experience.controls; let i = index" [formGroupName]="i">
      <div class="row g-3">
        <div class="col-lg-4 col-md-6">
          <label class="form-label">Company name</label>
          <input pInputText class="form-control" formControlName="companyName" placeholder="Enter company name">
        </div>
        <div class="col-lg-4 col-md-6">
          <label class="form-label">Job Title</label>
          <input pInputText class="form-control" formControlName="jobTitle" placeholder="Enter job title">
        </div>
        <div class="col-lg-4 col-md-6">
          <label class="form-label">Designation</label>
          <input pInputText class="form-control" formControlName="designation" placeholder="Enter designation">
        </div>

        <div class="col-lg-4 col-md-6">
          <label class="form-label">Salary Slips</label>
          <input type="file" class="form-control" accept=".pdf,.jpg,.jpeg,.png" (change)="onFile($event, i, 'salarySlips')">
        </div>
        <div class="col-lg-4 col-md-6">
          <label class="form-label">Relieving letter</label>
          <input type="file" class="form-control" accept=".pdf,.jpg,.jpeg,.png" (change)="onFile($event, i, 'relievingLetter')">
        </div>

        <div class="col-lg-4 col-md-6">
          <label class="form-label">From date</label>
          <input type="text" class="form-control" placeholder="DD/MM/YYYY" appCalendarDatepicker>
        </div>
        <div class="col-lg-4 col-md-6">
          <label class="form-label">To date</label>
         <input type="text" class="form-control" placeholder="DD/MM/YYYY" appCalendarDatepicker>
        </div>

        <div class="col-lg-4 col-md-6 align-self-end mb-1">
          <button *ngIf="i > 0" type="button" class="btn btn-danger" (click)="remove(i)">Delete</button>
        </div>
      </div>
      <hr class="mt-3 mb-3">
    </div>
  </div>
</div>

<div class="d-flex justify-content-start">
  <button type="button" class="btn btn-primary" (click)="add()">+ Add Experience</button>
</div>
