<div class="ne-section-title">OT Approval :-</div>

<div class="ne-otapp-wrapper" [formGroup]="otApproval">
  <div class="row g-3" formArrayName="levels">
    <div class="col-lg-6" *ngFor="let lvl of levels.controls; let i = index">
      <div class="ne-otapp-row">
        <div class="ne-otapp-col">
          <label>{{ ordinal(i + 1) }} Level Approval</label>
          <p-select [formControlName]="i" [options]="fs.managers" optionLabel="label" optionValue="value"
                    placeholder="Non selected" styleClass="w-100" [showClear]="true" appendTo="body" />
        </div>

        <button *ngIf="i === 0" type="button" class="ne-otapp-btn-add" title="Add approval level" (click)="addLevel()">+</button>
        <button *ngIf="i > 0" type="button" class="ne-otapp-btn-remove" title="Remove level" (click)="removeLevel(i)">-</button>
      </div>
    </div>
  </div>
</div>
