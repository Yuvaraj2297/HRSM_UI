<div class="form-section-title"><span class="form-section-icon"><i class="bi bi-clock-history"></i></span>OT Approval</div>

<div class="ui-sec" [formGroup]="otApproval">
  <div class="row g-3" formArrayName="levels">
    <div class="col-lg-6" *ngFor="let lvl of levels.controls; let i = index">
      <div class="ui-repeat-row">
        <div>
          <label class="form-label">{{ ordinal(i + 1) }} Level Approval</label>
          <app-select [formControlName]="i" [options]="fs.managers" optionLabel="label" optionValue="value" placeholder="Non selected" />
        </div>
        <button *ngIf="i === 0" type="button" class="btn-icon btn-icon-primary" aria-label="Add approval level" (click)="addLevel()"><i class="bi bi-plus-lg"></i></button>
        <button *ngIf="i > 0" type="button" class="btn-icon btn-icon-danger" aria-label="Remove level" (click)="removeLevel(i)"><i class="bi bi-dash-lg"></i></button>
      </div>
    </div>
  </div>
</div>
