<div class="ui-page-head">
  <div>
    <h1 class="page-title">Employee Tree</h1>
    <nav class="page-breadcrumb">
      <i class="bi bi-diagram-3 icon-breadcrumb"></i>
      <span>Employee Management</span>
      <i class="bi bi-chevron-right separator"></i>
      <span class="active-crumb">Organization Tree</span>
    </nav>
  </div>

  <div class="card-header-actions">
    <div class="view-toggle" role="tablist" aria-label="Tree view">
      <button type="button" role="tab" class="view-toggle-btn" [class.active]="activeView === 'dept'" [attr.aria-selected]="activeView === 'dept'" (click)="setView('dept')">Department Tree</button>
      <button type="button" role="tab" class="view-toggle-btn" [class.active]="activeView === 'emp'" [attr.aria-selected]="activeView === 'emp'" (click)="setView('emp')">Employee Tree</button>
    </div>

    <button type="button" class="btn-icon" (click)="resetView()" aria-label="Reset view"><i class="bi bi-arrow-counterclockwise"></i></button>
    <button type="button" class="btn-icon" (click)="printTree()" aria-label="Print"><i class="bi bi-printer"></i></button>
    <button type="button" class="btn-icon" (click)="openFilter()" aria-label="Filter"><i class="bi bi-sliders"></i></button>
  </div>
</div>

<!-- Tree body scrolls inside its own box so the header above stays visible -->
<div class="tree-scroll-area side-scroll">

  <!-- Department tree -->
  <div class="ui-list" *ngIf="activeView === 'dept'">
    <div class="ui-tree-row" *ngFor="let dept of departments">
      <button type="button" class="ui-tile ui-tile--row ui-tree-node" [class.selected]="dept.id === selectedDeptId" (click)="toggleDept(dept.id)">
        <span class="ui-avatar" [style.background]="dept.color">{{ dept.name.charAt(0) }}</span>
        <span class="min-w-0">
          <span class="ui-tile-name d-block text-truncate">{{ dept.name }}</span>
        </span>
      </button>

      <div class="ui-tree-link" [class.is-open]="dept.id === selectedDeptId" *ngIf="dept.employees?.length" (click)="toggleDept(dept.id)">
        <span class="ui-tree-count" [class.is-open]="dept.id === selectedDeptId">{{ dept.employeeCount }}</span>
      </div>

      <div class="ui-tree-children is-animating" *ngIf="dept.id === selectedDeptId">
        <button type="button" class="ui-tile ui-tile--row ui-tree-node" *ngFor="let emp of dept.employees"
          [class.selected]="selectedDetail === emp" (click)="showDetail(emp); $event.stopPropagation()">
          <img [src]="emp.img" [alt]="emp.name" class="ui-avatar">
          <span class="min-w-0">
            <span class="ui-tile-name d-block text-truncate">{{ emp.code }} {{ emp.name }}</span>
            <span class="ui-cell-sub">{{ emp.dept }}</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Employee tree: every node renders; collapsed children are hidden -->
  <div class="ui-list" *ngIf="activeView === 'emp'">
    <ng-template #empNode let-node>
      <div class="ui-tree-row">
        <!-- a click expands the branch and opens the detail panel -->
        <button type="button" class="ui-tile ui-tile--row ui-tree-node"
          [class.selected]="isExpanded(node.id) || selectedDetail === node"
          (click)="toggleEmp(node.id); showDetail(node)">
          <img [src]="node.img" [alt]="node.name" class="ui-avatar">
          <span class="min-w-0">
            <span class="ui-tile-name d-block text-truncate">{{ node.code }} {{ node.name }}</span>
            <span class="ui-cell-sub">{{ node.dept }}</span>
          </span>
        </button>

        <div class="ui-tree-link" [class.is-open]="isExpanded(node.id)" *ngIf="node.children?.length"
          (click)="$event.stopPropagation(); toggleEmp(node.id); showDetail(node)">
          <span class="ui-tree-count" [class.is-open]="isExpanded(node.id)">{{ countChildren(node) }}</span>
        </div>

        <div class="ui-tree-children" [class.is-collapsed]="!isExpanded(node.id)">
          <div *ngFor="let child of node.children">
            <ng-container *ngTemplateOutlet="empNode; context: { $implicit: child }"></ng-container>
          </div>
        </div>
      </div>
    </ng-template>

    <div *ngFor="let root of employeeTree">
      <ng-container *ngTemplateOutlet="empNode; context: { $implicit: root }"></ng-container>
    </div>
  </div>
</div>

<!-- Detail panel: opens on any node click -->
<aside class="ui-drawer detail-panel" *ngIf="selectedDetail as n" aria-label="Employee details">
  <div class="ui-drawer-head">
    <div class="ui-media p-0">
      <img class="ui-avatar" [src]="n.img" [alt]="n.name">
      <div>
        <div class="ui-drawer-title">{{ n.name }}</div>
        <div class="ui-media-sub">{{ n.code }}</div>
      </div>
    </div>
    <button type="button" class="btn-close-custom" (click)="hideDetail()" aria-label="Close"><i class="bi bi-x-lg"></i></button>
  </div>

  <div class="ui-drawer-body ui-list">
    <div class="ui-media">
      <span class="ui-ico ui-ico--sm"><i class="bi bi-briefcase"></i></span>
      <div><div class="ui-meta-label">Position</div><div class="ui-media-title">{{ n.pos }}</div></div>
    </div>
    <div class="ui-media">
      <span class="ui-ico ui-ico--sm"><i class="bi bi-building"></i></span>
      <div><div class="ui-meta-label">Department</div><div class="ui-media-title">{{ n.dept }}</div></div>
    </div>
    <div class="ui-media">
      <span class="ui-ico ui-ico--sm"><i class="bi bi-people"></i></span>
      <div><div class="ui-meta-label">Direct Reports</div><div class="ui-media-title">{{ directReportsCount(n) }}</div></div>
    </div>
    <div class="ui-media">
      <span class="ui-ico ui-ico--sm"><i class="bi bi-diagram-3"></i></span>
      <div><div class="ui-meta-label">Total Reports</div><div class="ui-media-title">{{ totalReportsCount(n) }}</div></div>
    </div>
  </div>
</aside>

<!-- Filter panel (Bootstrap offcanvas, opened from the TS) -->
<div class="offcanvas offcanvas-end" tabindex="-1" #countryOffcanvas aria-labelledby="treeFilterTitle">
  <div class="ui-drawer-head">
    <h5 class="ui-drawer-title" id="treeFilterTitle"><span class="ui-ico ui-ico--sm"><i class="bi bi-sliders"></i></span> Filter</h5>
    <button type="button" class="btn-close-custom" data-bs-dismiss="offcanvas" aria-label="Close"><i class="bi bi-x-lg"></i></button>
  </div>
  <div class="ui-drawer-body"></div>
</div>
