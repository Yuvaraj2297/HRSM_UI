<div class="staff-visit-page">

  <!-- =========================================================
       TITLE (follows the active tab) + TABS
  ========================================================== -->
  <!-- <h1 class="sv-page-title">{{ activeLabel() }}</h1> -->

  <nav class="page-tabs mb-3" role="tablist" aria-label="Staff reports">
    @for (tab of tabs; track tab.key) {
    <button type="button" role="tab" class="page-tab" [id]="'tab-' + tab.key" [class.active]="activeTab() === tab.key"
      [attr.aria-selected]="activeTab() === tab.key" [attr.aria-controls]="'panel-' + tab.key"
      (click)="selectTab(tab.key)">
      <i [class]="tab.icon"></i> {{ tab.label }}
    </button>
    }
  </nav>

  <!-- =========================================================
       REPORTS — each has its own filter
  ========================================================== -->
  @if (opened().has('visits')) {
  <section id="panel-visits" role="tabpanel" aria-labelledby="tab-visits" [hidden]="activeTab() !== 'visits'">
    <app-visit-km-report />
  </section>
  }

  @if (opened().has('locations')) {
  <section id="panel-locations" role="tabpanel" aria-labelledby="tab-locations"
    [hidden]="activeTab() !== 'locations'">
    <app-visit-location-report />
  </section>
  }

</div>
