<form [formGroup]="form" (submit)="$event.preventDefault(); onSave()" novalidate autocomplete="off">

  <!-- ===== SMTP ===== -->
  <section class="set-card" formGroupName="smtp">
    <h3><i class="bi bi-arrow-up-right-circle"></i>Outgoing Emails (SMTP)</h3>
    <div class="row g-3">
      <div class="col-md-6 field">
        <label for="smtp_host">SMTP Server address</label>
        <input id="smtp_host" class="form-control" formControlName="host" placeholder="smtp.example.com">
      </div>
      <div class="col-md-6 field">
        <label for="smtp_enc">SMTP Encryption</label>
        <p-select inputId="smtp_enc" formControlName="encryption" [options]="encryptions" optionLabel="label"
          optionValue="value" appendTo="body" styleClass="w-100" />
      </div>
      <div class="col-md-6 field">
        <label for="smtp_user">SMTP User name</label>
        <input id="smtp_user" class="form-control" formControlName="username" placeholder="info@yourdomain.com"
          [class.is-invalid]="invalid('smtp.username')">
        @if (invalid('smtp.username')) { <div class="field-error">Enter a valid email address.</div> }
      </div>
      <div class="col-md-6 field">
        <label for="smtp_pass">SMTP Password</label>
        <input id="smtp_pass" type="password" class="form-control" formControlName="password"
          placeholder="Leave blank to keep current" autocomplete="new-password">
      </div>
      <div class="col-md-6 field">
        <label for="smtp_port">SMTP port</label>
        <input id="smtp_port" class="form-control" formControlName="port" inputmode="numeric" placeholder="587"
          [class.is-invalid]="invalid('smtp.port')">
        @if (invalid('smtp.port')) { <div class="field-error">Port must be a number from 1 to 65535.</div> }
      </div>
      <div class="col-md-6 field">
        <label for="smtp_from">SMTP From name</label>
        <input id="smtp_from" class="form-control" formControlName="fromName" placeholder="GHARUDA SOFTWARE">
      </div>
    </div>

    <div class="radio-row" role="radiogroup" aria-label="Use SMTP">
      <span class="radio-label"><i class="bi bi-question-circle-fill"></i> Is SMTP</span>
      <label class="radio"><input type="radio" formControlName="enabled" [value]="true"> Yes</label>
      <label class="radio"><input type="radio" formControlName="enabled" [value]="false"> No</label>
    </div>
  </section>

  <!-- ===== IMAP ===== -->
  <section class="set-card" formGroupName="imap">
    <h3><i class="bi bi-arrow-down-left-circle"></i>Incoming Emails (IMAP)</h3>
    <div class="row g-3">
      <div class="col-md-6 field">
        <label for="imap_host">IMAP Server address</label>
        <input id="imap_host" class="form-control" formControlName="host" placeholder="imap.example.com">
      </div>
      <div class="col-md-6 field">
        <label for="imap_enc">IMAP Encryption</label>
        <p-select inputId="imap_enc" formControlName="encryption" [options]="encryptions" optionLabel="label"
          optionValue="value" appendTo="body" styleClass="w-100" />
      </div>
      <div class="col-md-6 field">
        <label for="imap_user">IMAP User name</label>
        <input id="imap_user" class="form-control" formControlName="username">
      </div>
      <div class="col-md-6 field">
        <label for="imap_pass">IMAP Password</label>
        <input id="imap_pass" type="password" class="form-control" formControlName="password"
          placeholder="Leave blank to keep current" autocomplete="new-password">
      </div>
      <div class="col-md-6 field">
        <label for="imap_port">IMAP port</label>
        <input id="imap_port" class="form-control" formControlName="port" inputmode="numeric" placeholder="993"
          [class.is-invalid]="invalid('imap.port')">
        @if (invalid('imap.port')) { <div class="field-error">Port must be a number from 1 to 65535.</div> }
      </div>
      <div class="col-md-6 field">
        <div class="radio-row mt-md-4" role="radiogroup" aria-label="Use IMAP">
          <span class="radio-label"><i class="bi bi-question-circle-fill"></i> Is IMAP</span>
          <label class="radio"><input type="radio" formControlName="enabled" [value]="true"> Yes</label>
          <label class="radio"><input type="radio" formControlName="enabled" [value]="false"> No</label>
        </div>
      </div>
    </div>
  </section>

  <div class="footer">
    <button type="submit" class="btn btn-primary px-4" [disabled]="busy()">
      @if (busy()) { <span class="spinner-border spinner-border-sm"></span>Saving... }
      @else { <i class="bi bi-check-lg"></i>Save Settings }
    </button>
  </div>

</form>
