<section class="card-custom dash-section">
  <header class="card-custom-header">
    <span class="card-header-icon"><i class="bi {{ icon() }}"></i></span>
    <div class="dash-section-title-wrap">
      <h3 class="card-custom-title">{{ title() }}</h3>
      @if (subtitle()) {
      <div class="dash-section-sub">{{ subtitle() }}</div>
      }
    </div>

    <div class="card-header-actions">
      <ng-content select="[section-actions]" />
      @if (meta()) {
      <span class="ui-count-chip">
        @if (metaIcon()) { <i class="bi {{ metaIcon() }} me-1"></i> }{{ meta() }}
      </span>
      }
    </div>
  </header>

  <div class="card-custom-body">
    <ng-content />
  </div>
</section>
